name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Instalar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 4. Configurar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Confirmar ferramentas
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      # 6. Escolher e descompactar o ZIP mais recente (Toque_*.zip)
      #    Nao e preciso editar este ficheiro quando sai uma versao nova:
      #    basta carregar o ZIP novo (ex.: Toque_3_0_Chat.zip) para o repositorio.
      - name: Descompactar projeto
        run: |
          ls -la
          ZIP=$(ls Toque_*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nao existe nenhum ficheiro Toque_*.zip na raiz do repositorio."
            exit 1
          fi
          echo "A usar: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          rm -rf build_src
          mkdir -p build_src
          unzip -o "$ZIP" -d build_src

      # 7. Encontrar a pasta do projeto (raiz do ZIP ou uma subpasta)
      - name: Verificar projeto
        run: |
          if [ -f build_src/settings.gradle.kts ]; then
            DIR=build_src
          else
            FOUND=$(find build_src -maxdepth 2 -name settings.gradle.kts | head -1)
            if [ -z "$FOUND" ]; then
              echo "ERRO: settings.gradle.kts nao encontrado dentro do ZIP."
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          echo "Projeto em: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"
          test -f "$DIR/settings.gradle.kts"
          test -f "$DIR/app/build.gradle.kts"

      # 8. Compilar APK
      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      # 9. Guardar o APK tambem como artefacto (copia de seguranca)
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: toque-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Publicar APK numa release
      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Toque.apk
          NAME="${ZIP%.zip}"
          gh release create "build-${{ github.run_number }}" Toque.apk \
            --title "$NAME (build ${{ github.run_number }})" \
            --notes "APK de teste gerado a partir de $ZIP" \
            --prerelease
