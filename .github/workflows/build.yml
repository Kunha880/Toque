name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Aceitar licencas do SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Descompactar projeto
        run: |
          mkdir -p build_src
          unzip -o projeto.zip -d build_src
      - name: Compilar
        working-directory: build_src
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build_src/app/build/outputs/apk/debug/app-debug.apk Toque.apk
          gh release create "v0.1-${{ github.run_number }}" Toque.apk \
            --title "Toque build ${{ github.run_number }}" \
            --notes "APK de teste" --prerelease
