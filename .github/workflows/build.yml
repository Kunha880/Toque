name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceitar licenças e instalar SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descompactar projeto
        run: |
          mkdir -p build_src
          unzip -o Toque_2_0_NFC.zip -d build_src

      - name: Compilar
        working-directory: build_src
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build_src/app/build/outputs/apk/debug/app-debug.apk Toque.apk
          gh release create "v2.0-${{ github.run_number }}" Toque.apk \
            --title "Toque build ${{ github.run_number }}" \
            --notes "APK de teste — Toque 2.0 NFC" \
            --prerelease
